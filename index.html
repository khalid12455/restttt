<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fuul & Hummus - Traditional Iraqi Restaurant in Erbil">
    <title>Fuul & Hummus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Image -->
    <img src="./images/foul-w-hummus.webp" alt="Restaurant background" class="page-background">

    <!-- Logo -->
    <img src="images/WhatsApp Image 2026-05-03 at 8.51.13 PM.jpeg" alt="Fuul & Hummus Logo" class="site-logo">

    <!-- Main Container -->
    <div class="landing-container">
        <!-- Animated Title -->
        <h1 class="page-title" id="main-title">Welcome</h1>

        <!-- Language Selection -->
        <div class="language-button-group">
            <button class="language-selector-button" data-lang="ar">
                <strong>العربية</strong>
            </button>
            <button class="language-selector-button" data-lang="eng">
                <strong>English</strong>
            </button>
            <button class="language-selector-button" data-lang="kurdi">
                <strong>کوردی</strong>
            </button>
        </div>

        <!-- Google Map -->
        <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d51490.792198556!2d43.995224799999995!3d36.235254499999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40071f639d941e99%3A0xfdb91f1ea369aa00!2zRnV1bCB3IEh1bW11cyDZgdmI2YQg2YjYrdmF2LU!5e0!3m2!1sen!2siq!4v1777824240760!5m2!1sen!2siq" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <script>
        // Typewriter Animation
        const titleElement = document.getElementById('main-title');
        const languages = ['Welcome', 'هلاً بكم', 'بەخێربێن'];
        let currentIndex = 0;
        let isTyping = true;
        let charIndex = 0;

        function typeWriter() {
            const currentText = languages[currentIndex];
            if (isTyping) {
                titleElement.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
                if (charIndex === currentText.length) {
                    isTyping = false;
                    setTimeout(typeWriter, 2000);
                    return;
                }
            } else {
                titleElement.textContent = currentText.substring(0, charIndex);
                charIndex--;
                if (charIndex < 0) {
                    isTyping = true;
                    currentIndex = (currentIndex + 1) % languages.length;
                    setTimeout(typeWriter, 500);
                    return;
                }
            }
            setTimeout(typeWriter, isTyping ? 100 : 50);
        }

        typeWriter();

        // Language Selection
        document.querySelectorAll('.language-selector-button').forEach(button => {
            button.addEventListener('click', function() {
                const lang = this.getAttribute('data-lang');
                localStorage.setItem('userLanguage', lang);
                
                // Navigate to appropriate language page
                const langPages = {
                    'ar': 'lang/ar.html',
                    'eng': 'lang/eng.html',
                    'kurdi': 'lang/kurdi.html'
                };
                
                window.location.href = langPages[lang];
            });
        });
    </script>
</body>
</html>
