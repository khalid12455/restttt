<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="فول وحمص - قائمة المطعم">
    <title>فول وحمص</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <a href="../index.html" class="nav-link">العودة للرئيسية</a>
        <h1 class="header-title" data-key="title">فول وحمص</h1>
        <div class="language-switch">
            <button class="language-switch-button active" data-lang="ar">العربية</button>
            <button class="language-switch-button" data-lang="eng">English</button>
            <button class="language-switch-button" data-lang="kurdi">کوردی</button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Banner Image -->
        <img src="../images/foul-w-hummus.webp" alt="فول وحمص" class="menu-banner">

        <!-- Menu Card -->
        <div class="menu-wrapper">
            <div class="menu-card">
                <h2 class="menu-title" data-key="title">فول وحمص - القائمة</h2>
                <p class="menu-address" data-key="address">📍 أربيل، العراق</p>

                <!-- Fuul Item -->
                <div class="menu-item">
                    <img src="../images/foul-w-hummus.webp" alt="فول" class="item-img">
                    <div class="item-overlay">
                        <h3 data-key="fuul">فول</h3>
                    </div>
                </div>
                <div class="item-price">
                    <span class="item-price-label">السعر:</span>
                    <span class="item-price-value">5,000 د.ع</span>
                </div>

                <!-- Sharqi Item -->
                <div class="menu-item">
                    <img src="../images/foul-w-hummus.webp" alt="شرقي" class="item-img">
                    <div class="item-overlay">
                        <h3 data-key="sharqi">شرقي</h3>
                    </div>
                </div>
                <div class="item-price">
                    <span class="item-price-label">السعر:</span>
                    <span class="item-price-value">6,500 د.ع</span>
                </div>

                <!-- Chicken Item -->
                <div class="menu-item">
                    <img src="../images/foul-w-hummus.webp" alt="دجاج" class="item-img">
                    <div class="item-overlay">
                        <h3 data-key="chicken">دجاج كهرمانة</h3>
                    </div>
                </div>
                <div class="item-price">
                    <span class="item-price-label">السعر:</span>
                    <span class="item-price-value">8,000 د.ع</span>
                </div>

                <!-- Xarbi Item -->
                <div class="menu-item">
                    <img src="../images/foul-w-hummus.webp" alt="غربي" class="item-img">
                    <div class="item-overlay">
                        <h3 data-key="xarbi">غربي</h3>
                    </div>
                </div>
                <div class="item-price">
                    <span class="item-price-label">السعر:</span>
                    <span class="item-price-value">6,500 د.ع</span>
                </div>

                <!-- Navigation -->
                <div class="nav-container">
                    <a href="../index.html" class="nav-link">العودة للرئيسية</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Translations
        const translations = {
            ar: {
                title: "فول وحمص - القائمة",
                address: "📍 أربيل، العراق",
                fuul: "فول",
                chicken: "دجاج كهرمانة",
                sharqi: "شرقي",
                xarbi: "غربي"
            },
            eng: {
                title: "Fuul & Hummus - Menu",
                address: "📍 Erbil, Iraq",
                fuul: "FUUL",
                chicken: "CHICKEN KAHRAMANA",
                sharqi: "SHARQI",
                xarbi: "XARBI"
            },
            kurdi: {
                title: "فول و حومس - لیست",
                address: "📍 هەولێر، عێراق",
                fuul: "فول",
                chicken: "مریشکی کەهرەمانە",
                sharqi: "شرقی",
                xarbi: "غربی"
            }
        };

        // Apply Language
        function applyLanguage(lang) {
            const isRTL = (lang === 'ar' || lang === 'kurdi');
            document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;

            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[lang] && translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });

            localStorage.setItem('userLanguage', lang);
        }

        // Initialize Language
        const savedLang = localStorage.getItem('userLanguage') || 'ar';
        applyLanguage(savedLang);

        // Language Switch Buttons
        document.querySelectorAll('.language-switch-button').forEach(button => {
            button.addEventListener('click', function() {
                const lang = this.getAttribute('data-lang');
                
                // Update active button
                document.querySelectorAll('.language-switch-button').forEach(btn => {
                    btn.classList.remove('active');
                });
                this.classList.add('active');

                applyLanguage(lang);
            });

            // Mark current language as active
            if (button.getAttribute('data-lang') === savedLang) {
                button.classList.add('active');
            }
        });
    </script>
</body>
</html>
